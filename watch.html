<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch the Series &mdash; Agriculture &times; Blockchain</title>
<meta name="description" content="Every published episode of the Agriculture x Blockchain series, in one place, linked back to the research behind each one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23201B14'/%3E%3Cpath d='M16 6 L23 16 L16 26 L9 16 Z' fill='none' stroke='%23D9A441' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .watch-page { max-width: 920px; margin: 0 auto; padding: 48px 24px 80px; }
  .watch-back { font-family: var(--font-mono); font-size: 12px; color: var(--parchment-300); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; }
  .watch-header { margin-bottom: 40px; }
  .watch-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--shoot-300); margin: 0 0 10px; }
  .watch-header h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0 0 14px; color: var(--ledger-300); }
  .watch-header p { font-family: var(--font-body); color: var(--parchment-300); font-size: 15px; line-height: 1.6; max-width: 62ch; margin: 0; }
  .watch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .watch-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--soil-900); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s ease, transform .15s ease; }
  .watch-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .watch-thumb { aspect-ratio: 9 / 12; background: linear-gradient(160deg, var(--soil-850), var(--soil-800)); display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid var(--line); }
  .watch-thumb .ep-num { font-family: var(--font-mono); font-size: 11px; color: var(--parchment-600); position: absolute; top: 12px; left: 14px; }
  .watch-play { width: 46px; height: 46px; border-radius: 50%; border: 1.4px solid var(--wheat-500); display: flex; align-items: center; justify-content: center; color: var(--wheat-500); }
  .watch-play svg { margin-left: 3px; }
  .watch-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .watch-title { font-family: var(--font-display); font-size: 16px; line-height: 1.3; color: var(--ledger-300); margin: 0; }
  .watch-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--parchment-600); text-transform: uppercase; letter-spacing: 0.04em; }
  .watch-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
  .watch-btn { font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--ledger-400); text-decoration: none; }
  .watch-btn:hover { border-color: var(--wheat-500); color: var(--wheat-500); text-decoration: none; }
  .watch-btn--pending { color: var(--parchment-600); border-style: dashed; cursor: default; }
  .watch-btn--pending:hover { border-color: var(--line-strong); color: var(--parchment-600); }
  .watch-research { font-size: 10.5px; }
</style>
</head>
<body>

<div class="watch-page">
  <a class="watch-back" href="index.html">&larr; Back to the Field Ledger</a>

  <header class="watch-header">
    <p class="watch-eyebrow">Agriculture &times; Blockchain</p>
    <h1>Watch the series</h1>
    <p>Every published episode, shortest first to find, linked to the research entry behind it. New episodes land here once they&rsquo;re shot &mdash; scripted-but-unshot episodes stay in the <a href="index.html">Field Ledger</a> until then.</p>
  </header>

  <section class="watch-grid" id="watchGrid" aria-label="Published episodes">
    <!-- populated by watch.js -->
  </section>
</div>

<script src="data.js"></script>
<script src="watch.js"></script>
</body>
</html>
